<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .form-container {
            width: 500px;
            margin: 30px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .gender {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            cursor: pointer;
        }

        .submit {
            background: green;
            color: white;
        }

        .reset {
            background: red;
            color: white;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Registration Form</h2>

    <form>
        
        <label>First Name</label>
        <input type="text" required>

        <label>Last Name</label>
        <input type="text" required>

       
        <label>Email</label>
        <input type="email" required>

        <label>Password</label>
        <input type="password" required>

       
        <label>Phone Number</label>
        <input type="tel">

       
        <label>Date of Birth</label>
        <input type="date">

        <label>Gender</label>
        <div class="gender">
            <label><input type="radio" name="gender"> Male</label>
            <label><input type="radio" name="gender"> Female</label>
        </div>

      
        <label>Address</label>
        <textarea rows="3"></textarea>

      
        <label>City</label>
        <input type="text">

        <label>State</label>
        <input type="text">

        <label>Course</label>
        <select>
            <option>Select Course</option>
            <option>BA</option>
            <option>BCA</option>
            <option>BSc</option>
            <option>BCom</option>
        </select>

        <label>Hobbies</label>
        <label><input type="checkbox"> Sports</label>
        <label><input type="checkbox"> Music</label>
        <label><input type="checkbox"> Reading</label>

        <div class="buttons">
            <button type="submit" class="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>
</div>

</body>
</html>
